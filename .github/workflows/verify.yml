name: Verify and package Cue
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: app,dmg
          - os: windows-2025
            bundles: nsis
          - os: ubuntu-24.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Test native paste target lifecycle
        if: runner.os == 'macOS'
        run: npm run test:native-paste
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Package local test builds
        if: runner.os != 'macOS'
        run: npm run package -- --bundles ${{ matrix.bundles }}
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"
      - name: Package macOS app and drag installer
        if: runner.os == 'macOS'
        run: npm run package:mac
      - name: Save test executables
        uses: actions/upload-artifact@v4
        with:
          name: cue-${{ runner.os }}-test-build
          path: |
            src-tauri/target/release/bundle/
          if-no-files-found: error
