name: Verify Cue
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Unit tests
        run: make test-unit
      - name: Build
        run: make build
      - name: UI test (keyboard workflow)
        run: make test-ui
