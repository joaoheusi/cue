name: CI
# Every push and pull request is tested. A push to main also publishes a signed, notarized
# release with a Sparkle appcast, which installed copies of Cue pick up automatically.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main build mid-release; supersede stale branch builds.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check that the Xcode project matches project.yml
        run: |
          brew install xcodegen
          xcodegen generate --quiet
          git diff --exit-code -- Cue.xcodeproj
      - name: Unit tests
        run: make test-unit
      - name: Build
        run: make build
      - name: UI test (keyboard workflow)
        run: make test-ui

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      DEVELOPMENT_TEAM: SC7RQ3BWQ6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count
      - name: Require signing and notarization secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=0
          for name in P12 P12_PASSWORD API_KEY API_KEY_ID API_ISSUER SPARKLE; do
            if [ -z "${!name}" ]; then echo "::error::Release secret for $name is not set. Run scripts/setup-release-secrets.sh."; missing=1; fi
          done
          exit $missing
      - name: Import the Developer ID certificate into a temporary keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::The certificate is not a Developer ID Application identity."; exit 1; }
      - name: Write the App Store Connect API key
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and sign the update
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/release.sh
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat build/release/version)"
          gh release create "v$VERSION" build/release/Cue.dmg build/release/appcast.xml \
            --title "Cue $VERSION" --target "$GITHUB_SHA" --generate-notes --latest
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            build/release/build.log
            build/release/notarization.log
          if-no-files-found: ignore
      - name: Remove the temporary keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
